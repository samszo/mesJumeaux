<script>
  const MONTHS = ['','Janvier','Février','Mars','Avril','Mai','Juin',
    'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const tooltip = d3.select("#tooltip");

  // ── Rate-limiter images avec progression ─────────────────────────────────
  const imageRateLimiter = {
    BATCH_SIZE: 50,
    INTERVAL: 1000,
    queue: [],
    timer: null,
    _total: 0,
    _done: 0,
    _cancelled: false,
    _countdownTimer: null,

    enqueue(entity, imgEl) {
      if (!imgEl || imgEl.dataset.queued) return;
      imgEl.dataset.queued = '1';
      this.queue.push({ entity, imgEl });
      this._total++;
      if (!this.timer) {
        this._cancelled = false;
        this._showModal();
        this._next();
      } else {
        this._updateModal();
      }
    },

    cancel() {
      this._cancelled = true;
      clearTimeout(this.timer);
      clearInterval(this._countdownTimer);
      this.timer = null;
      this.queue = [];
      this._total = 0;
      this._done = 0;
      this._hideModal();
    },

    _next() {
      if (this._cancelled || !this.queue.length) {
        this.timer = null;
        if (!this._cancelled) this._hideModal();
        return;
      }
      this.timer = -1;
      const batch = this.queue.splice(0, this.BATCH_SIZE);
      this._updateModal();
      //getP18ImageBatch(batch.map(b => b.entity)).then(urlMap => {
      getImageBatch(batch.map(b => b.entity)).then(urlMap => {
        for (const { entity, imgEl } of batch) {
          const url = entity.image;
          if (url && imgEl) { imgEl.src = url; imgEl.onload = () => imgEl.classList.add('loaded'); }
        }
        this._done += batch.length;
        this._updateModal();
      }).finally(() => {
        if (this._cancelled) return;
        if (!this.queue.length) { this.timer = null; this._hideModal(); return; }
        this._startCountdown();
        this.timer = setTimeout(() => {
          clearInterval(this._countdownTimer);
          this._next();
        }, this.INTERVAL);
      });
    },

    _startCountdown() {
      let remaining = Math.ceil(this.INTERVAL / 1000);
      document.getElementById('img-progress-timer').textContent =
        `Prochain batch dans ${remaining}s`;
      clearInterval(this._countdownTimer);
      this._countdownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) { clearInterval(this._countdownTimer); return; }
        document.getElementById('img-progress-timer').textContent =
          `Prochain batch dans ${remaining}s`;
      }, 1000);
    },

    _showModal() {
      this._done = 0;
      this._total = this.queue.length;
      document.getElementById('img-progress').classList.remove('hidden');
      this._updateModal();
    },

    _hideModal() {
      document.getElementById('img-progress').classList.add('hidden');
      document.getElementById('img-progress-timer').textContent = '';
      this._total = 0;
      this._done  = 0;
    },

    _updateModal() {
      const pct       = this._total ? Math.round(this._done / this._total * 100) : 0;
      const remaining = this._total - this._done;
      document.getElementById('img-progress-bar').style.width = pct + '%';
      document.getElementById('img-progress-label').textContent =
        ` - 🖼 ${this._done}/${this._total}${remaining ? ` (${remaining} restantes)` : ''}`;
    },

    prioritize(entityIds) {
      const ids = new Set(entityIds);
      const priority = this.queue.filter(e => ids.has(e.entityId));
      const rest     = this.queue.filter(e => !ids.has(e.entityId));
      this.queue = [...priority, ...rest];
    },

    get pending() { return this.queue.length; },
  };

  let state = {
    running: false, allResults: [],
    day: 17, month: 6, startYear: 2025, endYear: 1800,
    viewMode: 'year', cardsByQid: new Map(),
    mapFilterIds: null, mapPoints: [],
  };

  // ── Catégories de personnes (classification par mots-clés) ────────────────
  // Faute d'occupation (P106) en base locale, on déduit la catégorie depuis
  // le champ "description" (courte notice Wikidata, FR/EN principalement).
  let occupations = [];
  const CATEGORIES = [
    { key: 'politiciens',    label: 'Politiciens',    icon: '🏛️', keywords: [
      'politicien','politicienne','politique','homme politique','femme politique','president','ministre',
      'senateur','senatrice','depute','deputee','maire','diplomate','roi ','reine','empereur',
      'imperatrice','duc ','duchesse','prince','princesse','chancelier','chanceliere',
      'gouverneur','gouverneure','politician','senator','minister','mayor','diplomat','king ',
      'queen','emperor','empress',
    ]},
    { key: 'sportifs',       label: 'Sportifs',       icon: '🏅', keywords: [
      'footballeur','footballeuse','joueur de football','joueuse de football','athlete',
      'nageur','nageuse','cycliste','boxeur','boxeuse','basketteur','basketteuse','tennisman',
      'tenniswoman','judoka','hockeyeur','hockeyeuse','rugbyman','pilote automobile','gymnaste',
      'skieur','skieuse','escrimeur','escrimeuse','karateka','halterophile','sportif','sportive',
      'joueur de ','joueuse de ','footballer','swimmer','cyclist','boxer','basketball player',
      'tennis player','gymnast','skier','weightlifter','wrestler','wrestling','sprinter',
      'marathon','handball','volleyball','baseball player','ice hockey player','speed skater',
      'fencer','archer','rower','rugby','javelin','discus','hurdler','triathlete','curler',
    ]},
    { key: 'artistes',       label: 'Artistes',       icon: '🎨', keywords: [
      'acteur','actrice','chanteur','chanteuse','musicien','musicienne','peintre','sculpteur',
      'sculptrice','ecrivain','ecrivaine','romancier','romanciere','poete','poetesse',
      'realisateur','realisatrice','cineaste','photographe','danseur','danseuse','artiste',
      'dessinateur','dessinatrice','scenariste','compositeur','compositrice','choregraphe',
      'designer','architecte','organiste','organist','musicolog',
      'actor','actress','singer','musician','painter','sculptor','writer','novelist','poet',
      'film director','photographer','dancer','artist','composer','choreographer','cartoonist',
      'architect',
    ]},
    { key: 'scientifiques',  label: 'Scientifiques',  icon: '🔬', keywords: [
      'scientifique','physicien','physicienne','chimiste','biologiste','mathematicien',
      'mathematicienne','astronome','medecin','chercheur','chercheuse','ingenieur','ingenieure',
      'inventeur','inventrice','naturaliste','botaniste','geologue','scientist','physicist',
      'chemist','biologist','mathematician','astronomer','physician','researcher','engineer',
      'inventor',
    ]},
    { key: 'religieux',      label: 'Religieux',      icon: '✝️', keywords: [
      'eveque','pretre','pape','cardinal','moine','theologien','theologienne','rabbin','imam',
      'pasteur','religieuse','abbe ','bishop','priest','pope','monk','theologian','rabbi',
    ]},
    { key: 'militaires',     label: 'Militaires',     icon: '🎖️', keywords: [
      'militaire','general','generale','officier','soldat','amiral','colonel','capitaine',
      'marechal','soldier','admiral',
    ]},
    { key: 'juristes',       label: 'Juristes',       icon: '⚖️', keywords: [
      'juriste','avocat','avocate','juge','magistrat','magistrate','lawyer','judge','jurist',
    ]},
    { key: 'entrepreneurs',  label: "Entrepreneurs",  icon: '💼', keywords: [
      "entrepreneur","entrepreneuse","homme d'affaires","femme d'affaires","industriel",
      'industrielle','businessman','businesswoman',
    ]},
    { key: 'journalistes',   label: 'Journalistes',   icon: '📰', keywords: [
      'journaliste','presentateur','presentatrice','journalist','broadcaster',
    ]},
  ];
  const CATEGORY_AUTRES = { key: 'autres', label: 'Autres', icon: '👤' };

  function normalizeText(str) {
    return String(str || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function classifyCategory(r) {
    //récupère les class
    let desc = "";
    r.occus.forEach((o,i)=>{
      let refOccu = occupations.filter(ref=>ref.id==o);
      if(refOccu.length)o = refOccu[0];
      desc += i==0 ? "" : ", ";
      desc += o.gClassLabel+" -> "+o.label; 
    })
    const norm = normalizeText(desc);
    if (!norm) return CATEGORY_AUTRES;
    for (const cat of CATEGORIES) {
      if (cat.keywords.some(kw => norm.includes(kw))) return cat;
    }
    return CATEGORY_AUTRES;
  }

  // Indice de célébrité = calcul fait dans la requêtes d'extraction par rapport aux données de la base :
  // (e.sitelinks + e.statements + e.externalIds) * (COUNT(DISTINCT pInf.entity_id)+1) importance 
  function celebrityScore(r) {
    return r.importance;
  }

  // ── Filtres cumulatifs (indice de célébrité + catégorie) ────────────────
  function populateCategoryFilterOptions() {
    const select = document.getElementById('categoryFilterSelect');
    select.innerHTML = '<option value="">Toutes catégories</option>' +
      [...CATEGORIES, CATEGORY_AUTRES].map(c =>
        `<option value="${c.key}">${c.icon} ${escapeHtml(c.label)}</option>`).join('');
  }

  // ── Slider à deux curseurs (indice de célébrité) ────────────────────────
  // Les bornes du slider sont recalculées à chaque recherche pour coller
  // aux indices de célébrité réellement présents dans les résultats affichés.
  function setCelebSliderBounds(min, max) {
    min = Math.floor(min || 0);
    max = Math.ceil(max || 0);
    if (min === max) max = min + 1;
    const minRange = document.getElementById('celebMinRange');
    const maxRange = document.getElementById('celebMaxRange');
    // step reste à 1 : un pas plus large ferait arrondir .value au multiple de step
    // le plus proche (y compris pour une affectation programmatique), ce qui peut
    // exclure le score maximum réel du curseur "max" une fois replacé en butée.
    for (const r of [minRange, maxRange]) {
      r.min = min;
      r.max = max;
      r.step = 1;
    }
    minRange.value = min;
    maxRange.value = max;
    updateCelebSliderUI();
  }

  function onCelebRangeInput(which) {
    const minRange = document.getElementById('celebMinRange');
    const maxRange = document.getElementById('celebMaxRange');
    if (which === 'min' && +minRange.value > +maxRange.value) minRange.value = maxRange.value;
    if (which === 'max' && +maxRange.value < +minRange.value) maxRange.value = minRange.value;
    updateCelebSliderUI();
    applyFilters();
  }

  function updateCelebSliderUI() {
    const minRange = document.getElementById('celebMinRange');
    const maxRange = document.getElementById('celebMaxRange');
    const lo = +minRange.min, hi = +minRange.max, span = (hi - lo) || 1;
    const minV = +minRange.value, maxV = +maxRange.value;
    const pctMin = (minV - lo) / span * 100;
    const pctMax = (maxV - lo) / span * 100;
    const rangeEl = document.getElementById('celebSliderRange');
    rangeEl.style.left  = pctMin + '%';
    rangeEl.style.right = (100 - pctMax) + '%';
    document.getElementById('celebMinValue').textContent = minV.toLocaleString('fr-FR');
    document.getElementById('celebMaxValue').textContent = maxV.toLocaleString('fr-FR');
  }

  // ── Slider années ────────────────────────────────────────────────────────
  function setYearSliderBounds(min, max) {
    const minRange = document.getElementById('yearMinRange');
    const maxRange = document.getElementById('yearMaxRange');
    for (const r of [minRange, maxRange]) { r.min = min; r.max = max; r.step = 1; }
    minRange.value = min;
    maxRange.value = max;
    updateYearSliderUI();
  }

  function onYearRangeInput(which) {
    const minRange = document.getElementById('yearMinRange');
    const maxRange = document.getElementById('yearMaxRange');
    if (which === 'min' && +minRange.value > +maxRange.value) minRange.value = maxRange.value;
    if (which === 'max' && +maxRange.value < +minRange.value) maxRange.value = minRange.value;
    updateYearSliderUI();
    applyFilters();
  }

  function updateYearSliderUI() {
    const minRange = document.getElementById('yearMinRange');
    const maxRange = document.getElementById('yearMaxRange');
    const lo = +minRange.min, hi = +minRange.max, span = (hi - lo) || 1;
    const pctMin = (+minRange.value - lo) / span * 100;
    const pctMax = (+maxRange.value - lo) / span * 100;
    document.getElementById('yearSliderRange').style.left  = pctMin + '%';
    document.getElementById('yearSliderRange').style.right = (100 - pctMax) + '%';
    document.getElementById('yearMinValue').textContent = minRange.value || '–';
    document.getElementById('yearMaxValue').textContent = maxRange.value || '–';
  }

  function isYearFilterActive() {
    const minRange = document.getElementById('yearMinRange');
    const maxRange = document.getElementById('yearMaxRange');
    return +minRange.value > +minRange.min || +maxRange.value < +maxRange.max;
  }

  function resetFilters() {
    const minRange = document.getElementById('celebMinRange');
    const maxRange = document.getElementById('celebMaxRange');
    minRange.value = minRange.min;
    maxRange.value = maxRange.max;
    updateCelebSliderUI();
    const yMin = document.getElementById('yearMinRange');
    const yMax = document.getElementById('yearMaxRange');
    yMin.value = yMin.min;
    yMax.value = yMax.max;
    updateYearSliderUI();
    document.getElementById('categoryFilterSelect').value = '';
    state.mapFilterIds = null;
    applyFilters();
  }

  // Le filtre de célébrité est "actif" dès que le slider n'est plus sur sa
  // pleine plage (bornée sur les résultats affichés).
  function isCelebFilterActive() {
    const minRange = document.getElementById('celebMinRange');
    const maxRange = document.getElementById('celebMaxRange');
    return +minRange.value > +minRange.min || +maxRange.value < +maxRange.max;
  }

  // Trie chaque grille du plus célèbre au moins célèbre quand le filtre de
  // célébrité est actif, sinon restaure l'ordre naturel (année/catégorie).
  function reorderGrids() {
    const sortActive = isCelebFilterActive();
    document.querySelectorAll('.grid').forEach(grid => {
      if (sortActive) {
        const cards = [...grid.children];
        cards.sort((a, b) => (parseFloat(b.dataset.score) || 0) - (parseFloat(a.dataset.score) || 0));
        for (const c of cards) grid.appendChild(c);
      } else {
        const order = (grid.dataset.naturalOrder || '').split('|').filter(Boolean);
        for (const qid of order) {
          const cardEl = state.cardsByQid.get(qid);
          if (cardEl && cardEl.parentElement === grid) grid.appendChild(cardEl);
        }
      }
    });
  }

  // Retourne les cartes qui passent tous les filtres sauf celui exclu (cross-filtering).
  function _cardsVisibleExcluding(exclude) {
    const minVal = +document.getElementById('celebMinRange').value;
    const maxVal = +document.getElementById('celebMaxRange').value;
    const cat    = document.getElementById('categoryFilterSelect').value;
    const yMin   = +document.getElementById('yearMinRange').value;
    const yMax   = +document.getElementById('yearMaxRange').value;
    const result = [];
    for (const card of state.cardsByQid.values()) {
      let ok = true;
      if (exclude !== 'celeb') {
        const score = parseFloat(card.dataset.score) || 0;
        if (score < minVal || score > maxVal) ok = false;
      }
      if (ok && exclude !== 'cat' && cat && card.dataset.category !== cat) ok = false;
      if (ok && exclude !== 'year' && isYearFilterActive()) {
        const y = parseInt(card.dataset.year);
        if (!isNaN(y) && (y < yMin || y > yMax)) ok = false;
      }
      if (ok && exclude !== 'geo' && state.mapFilterIds !== null) {
        const { lat, lng, qid } = card.dataset;
        if (lat && lng && !state.mapFilterIds.has(qid)) ok = false;
      }
      if (ok) result.push(card);
    }
    return result;
  }

  // Met à jour les bornes/options des filtres selon les cartes encore visibles (faceting dynamique).
  let _updatingFacets = false;
  function updateFacets() {
    if (_updatingFacets) return;
    _updatingFacets = true;

    // --- Célébrité : bornes calculées sur les cartes visibles sans le filtre célébrité ---
    const celebCards = _cardsVisibleExcluding('celeb');
    if (celebCards.length) {
      const scores = celebCards.map(c => parseFloat(c.dataset.score) || 0);
      const newMin = Math.floor(Math.min(...scores));
      const newMax = Math.ceil(Math.max(...scores));
      const minR = document.getElementById('celebMinRange');
      const maxR = document.getElementById('celebMaxRange');
      const curMin = +minR.value, curMax = +maxR.value;
      for (const r of [minR, maxR]) { r.min = newMin; r.max = newMax; }
      minR.value = Math.max(newMin, Math.min(curMin, newMax));
      maxR.value = Math.min(newMax, Math.max(curMax, newMin));
      updateCelebSliderUI();
    }

    // --- Années : bornes calculées sur les cartes visibles sans le filtre année ---
    const yearCards = _cardsVisibleExcluding('year');
    if (yearCards.length) {
      const years = yearCards.map(c => parseInt(c.dataset.year)).filter(y => !isNaN(y));
      if (years.length) {
        const newMin = Math.min(...years), newMax = Math.max(...years);
        const yMinR = document.getElementById('yearMinRange');
        const yMaxR = document.getElementById('yearMaxRange');
        const curMin = +yMinR.value, curMax = +yMaxR.value;
        for (const r of [yMinR, yMaxR]) { r.min = newMin; r.max = newMax; }
        yMinR.value = Math.max(newMin, Math.min(curMin, newMax));
        yMaxR.value = Math.min(newMax, Math.max(curMax, newMin));
        updateYearSliderUI();
      }
    }

    // --- Catégorie : désactive les options sans cartes visibles ---
    const catCards = _cardsVisibleExcluding('cat');
    const availCats = new Set(catCards.map(c => c.dataset.category));
    const catSel = document.getElementById('categoryFilterSelect');
    for (const opt of catSel.options) {
      if (!opt.value) continue;
      opt.disabled = !availCats.has(opt.value);
    }
    if (catSel.value && !availCats.has(catSel.value)) {
      catSel.value = '';
    }

    // --- Carte : atténue les marqueurs filtrés par célébrité + année + catégorie ---
    if (leafletLayer) {
      const geoCards = _cardsVisibleExcluding('geo');
      const passQids = new Set(geoCards.map(c => c.dataset.qid));
      leafletLayer.eachLayer(m => {
        if (m._qid !== undefined) {
          const on = passQids.has(m._qid);
          m.setStyle({ fillOpacity: on ? 0.8 : 0, opacity: on ? 1 : 0 });
        }
      });
    }

    _updatingFacets = false;
  }

  function applyFilters() {
    const minVal = +document.getElementById('celebMinRange').value;
    const maxVal = +document.getElementById('celebMaxRange').value;
    const cat    = document.getElementById('categoryFilterSelect').value;
    const yMin   = +document.getElementById('yearMinRange').value;
    const yMax   = +document.getElementById('yearMaxRange').value;

    for (const card of state.cardsByQid.values()) {
      const score = parseFloat(card.dataset.score) || 0;
      let visible = true;
      if (score < minVal || score > maxVal) visible = false;
      if (cat && card.dataset.category !== cat) visible = false;
      if (isYearFilterActive()) {
        const y = parseInt(card.dataset.year);
        if (!isNaN(y) && (y < yMin || y > yMax)) visible = false;
      }
      if (state.mapFilterIds !== null) {
        const lat = card.dataset.lat;
        const lng = card.dataset.lng;
        if (lat && lng && !state.mapFilterIds.has(card.dataset.qid)) visible = false;
      }
      card.classList.toggle('filtered-out', !visible);
    }

    updateFacets();
    reorderGrids();

    document.querySelectorAll('.year-section').forEach(section => {
      const cards        = section.querySelectorAll('.card');
      const visibleCount = [...cards].filter(c => !c.classList.contains('filtered-out')).length;
      section.classList.toggle('hidden-by-filter', cards.length > 0 && visibleCount === 0);
      const countEl = section.querySelector('.year-count, .category-count');
      if (countEl && cards.length > 0) {
        const total = cards.length;
        countEl.textContent = visibleCount === total
          ? `${total} personnalité${total > 1 ? 's' : ''}`
          : `${visibleCount} / ${total} personnalité${total > 1 ? 's' : ''}`;
      }
    });
  }

  // ── Sélection d'items ────────────────────────────────────────────────────
  const selection = {
    _map: new Map(), // qid → item data
    add(qid, data) {
      this._map.set(qid, data);
      this._update();
    },
    remove(qid) {
      this._map.delete(qid);
      this._update();
    },
    clear() {
      this._map.clear();
      document.querySelectorAll('.card-checkbox:checked').forEach(cb => {
        cb.checked = false;
        cb.closest('.card')?.classList.remove('card-selected');
      });
      this._update();
    },
    get size() { return this._map.size; },
    get items() { return [...this._map.values()]; },
    _update() {
      const bar   = document.getElementById('selection-bar');
      const count = document.getElementById('selection-count');
      if (this._map.size > 0) {
        bar.classList.remove('hidden');
        count.textContent = `${this._map.size} item${this._map.size > 1 ? 's' : ''} sélectionné${this._map.size > 1 ? 's' : ''}`;
      } else {
        bar.classList.add('hidden');
      }
    },
  };

  function pad(n) { return String(n).padStart(2, '0'); }

  async function localFetch(day, month) {
    const response = await fetch(`local-query.php?day=${day}&month=${month}`);
    state.cache = response.headers.get('x-cache') === 'HIT';
    if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
    return response.json();
  }

  async function search() {
    const day       = parseInt(document.getElementById('day').value);
    const month     = parseInt(document.getElementById('month').value);
    const startYear = parseInt(document.getElementById('startYear').value);
    const endYear   = parseInt(document.getElementById('endYear').value);

    if (!day || day < 1 || day > 31) {
      showStatus('error', 'Veuillez saisir un jour valide (1–31).');
      return;
    }

    state.running     = true;
    state.allResults  = [];
    state.day         = day;
    state.month       = month;
    state.startYear   = startYear;
    state.endYear     = endYear;
    state.viewMode     = 'year';
    state.cardsByQid   = new Map();
    document.getElementById('groupToggleBtn').classList.remove('active');
    resetFilters();
    document.getElementById('searchBtn').disabled = true;
    document.getElementById('stop-bar').style.display = 'block';
    document.getElementById('results').innerHTML = '';
    document.getElementById('heatmap-section').style.display = 'none';
    document.getElementById('timeline').style.display = 'none';
    document.getElementById('timeline').innerHTML = '';
    document.getElementById('year-nav-list').innerHTML = '';

    showStatus('loading', `Interrogation de la base locale…`);

    try {
      const allRows = await localFetch(day, month);
      occupations = allRows.occupations;
      // Classification par catégorie + indice de célébrité (une seule fois par personne)
      // Groupe par année, filtre selon startYear/endYear
      const byYear = {};
      for (const r of allRows.jumeaux) {
        r.category = classifyCategory(r);
        r.celebrityScore = celebrityScore(r);
        const y = r.year;
        if (!y || y > startYear || y < endYear) continue;
        if (!byYear[y]) byYear[y] = [];
        byYear[y].push(r);
      }

      // Borne le slider d'indice de célébrité sur les résultats réellement affichés
      let scoreMin = Infinity, scoreMax = -Infinity;
      for (const list of Object.values(byYear)) {
        for (const r of list) {
          if (r.celebrityScore < scoreMin) scoreMin = r.celebrityScore;
          if (r.celebrityScore > scoreMax) scoreMax = r.celebrityScore;
        }
      }
      setCelebSliderBounds(isFinite(scoreMin) ? scoreMin : 0, isFinite(scoreMax) ? scoreMax : 1);

      // Affiche du plus récent au plus ancien
      const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);
      for (const year of years) {
        if (!state.running) break;
        appendYearSection(year, day, month, byYear[year]);
      }

      if (!years.length) showStatus('info', 'Aucun résultat pour cette date.');
    } catch (err) {
      showStatus('error', `Erreur : ${err.message}`);
    }

    finishSearch();
  }

  function createCard(r, year) {
    const name        = r.label    || '(sans nom)';
    const desc        = r.description || '';
    const article     = r.articlename  || '';
    const wikidataUrl = r.id ? `https://www.wikidata.org/wiki/${r.id}` : '#';
    const wpUrl       = r.wikilang ? `https://${r.wikilang}.wikipedia.org/wiki/${encodeURIComponent(article)}` : null;
    const category    = r.category || classifyCategory(r);
    const score       = r.celebrityScore ?? celebrityScore(r);

    const qid = r.id || '';
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.qid = qid;
    card.dataset.category = category.key;
    card.dataset.score = score;
    card.dataset.year = year;
    card.dataset.lat  = r.lat  ?? '';
    card.dataset.lng  = r.lng  ?? '';
    card.innerHTML = `
      <label class="card-select" title="Sélectionner">
        <input type="checkbox" class="card-checkbox" data-qid="${escapeHtml(qid)}">
      </label>
      <span class="card-category" title="Catégorie déduite de la description">${category.icon} ${escapeHtml(category.label)}</span>
      <div class="card-name">${escapeHtml(name)}</div>
      ${desc ? `<div class="card-desc">${escapeHtml(desc)}</div>` : ''}
      <div class="card-celeb${score > 0 ? '' : ' card-celeb-zero'}" title="Indice de célébrité = taille de la notice × personnes influencées">
        ⭐ ${score.toLocaleString('fr-FR')}${r.influencedCount > 0 ? ` (${r.influencedCount} influencé${r.influencedCount > 1 ? 's' : ''})` : ''}
      </div>
      <img id="${qid}-img" />
      <div style="margin-top:auto;display:flex;gap:0.6rem;flex-wrap:wrap">
        ${wpUrl ? `<a class="card-link" href="${escapeHtml(wpUrl)}" target="_blank" rel="noopener">Wikipedia →</a>` : ''}
        <a class="card-link" href="${escapeHtml(wikidataUrl)}" target="_blank" rel="noopener">Wikidata →</a>
      </div>`;
    card.querySelector('.card-checkbox').addEventListener('change', e => {
      const qid = e.target.dataset.qid;
      if (e.target.checked) {
        card.classList.add('card-selected');
        selection.add(qid, { year, name, desc, article, wikidataUrl, wpUrl, qid });
      } else {
        card.classList.remove('card-selected');
        selection.remove(qid);
      }
    });
    if (qid) state.cardsByQid.set(qid, card);
    return card;
  }

  function appendYearSection(year, day, month, results) {
    const container = document.getElementById('results');

    const section = document.createElement('div');
    section.className = 'year-section';
    section.id = `year-${year}`;

    const heading = document.createElement('div');
    heading.className = 'year-heading';
    heading.innerHTML = `${year}
      <span class="year-count">${results.length} personnalité${results.length > 1 ? 's' : ''}</span>`;
    /*  <button class="btn-year-img" data-year="${year}" title="Charger les images de cette année en priorité">🖼</button>`;
    heading.querySelector('.btn-year-img').addEventListener('click', () => {
      const ids = results.map(r => r.id).filter(Boolean);
      imageRateLimiter.prioritize(ids);
      heading.querySelector('.btn-year-img').disabled = true;
    });
    */
    section.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.dataset.naturalOrder = results.map(r => r.label).join('|');

    for (const r of results) {
      grid.appendChild(createCard(r, year));
    }

    section.appendChild(grid);
    container.appendChild(section);

    // Scroll jusqu'à la section de l'année courante
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });

    state.allResults.push({ year, items: results });
    addNavEntry(year, 'has-results', results.length);

    for (const r of results) {
      const imgEl = document.getElementById(r.id + '-img');
      if (imgEl && r.image) {
        imageRateLimiter.enqueue(r, imgEl);
      }
    }
  }

  // ── Vue "grouper par catégorie" ─────────────────────────────────────────
  // Réutilise les cards (et donc les images déjà chargées) en les déplaçant
  // dans le DOM plutôt qu'en les recréant.
  function toggleGroupByCategory() {
    if (!state.allResults.length) return;
    state.viewMode = state.viewMode === 'category' ? 'year' : 'category';
    document.getElementById('groupToggleBtn').classList.toggle('active', state.viewMode === 'category');
    if (state.viewMode === 'category') renderCategoryView();
    else renderYearViewFromState();

  function renderYearViewFromState() {
    const container = document.getElementById('results');
    container.innerHTML = '';
    for (const { year, items } of state.allResults) {
      if (!items.length) continue;
      const section = document.createElement('div');
      section.className = 'year-section';
      section.id = `year-${year}`;

      const heading = document.createElement('div');
      heading.className = 'year-heading';
      heading.innerHTML = `${year}
        <span class="year-count">${items.length} personnalité${items.length > 1 ? 's' : ''}</span>`;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.dataset.naturalOrder = items.map(r => r.label).join('|');
      for (const r of items) {
        const cardEl = state.cardsByQid.get(r.id);
        if (cardEl) grid.appendChild(cardEl);
      }
      section.appendChild(grid);
      container.appendChild(section);
    }
    applyFilters();
  }

  function renderCategoryView() {
    const container = document.getElementById('results');
    container.innerHTML = '';

    const groups = new Map();
    for (const { items } of state.allResults) {
      for (const r of items) {
        const cat = r.category || classifyCategory(r);
        if (!groups.has(cat.key)) groups.set(cat.key, { cat, items: [] });
        groups.get(cat.key).items.push(r);
      }
    }

    const order = [...CATEGORIES.map(c => c.key), CATEGORY_AUTRES.key];
    const sortedKeys = [...groups.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b));

    for (const key of sortedKeys) {
      const { cat, items } = groups.get(key);

      const section = document.createElement('div');
      section.className = 'year-section';

      const heading = document.createElement('div');
      heading.className = 'year-heading';
      heading.innerHTML = `${cat.icon} ${escapeHtml(cat.label)}
        <span class="category-count">${items.length} personnalité${items.length > 1 ? 's' : ''}</span>`;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.dataset.naturalOrder = items.map(r => r.label).join('|');
      for (const r of items) {
        const cardEl = state.cardsByQid.get(r.id);
        if (cardEl) grid.appendChild(cardEl);
      }
      section.appendChild(grid);
      container.appendChild(section);
    }
    applyFilters();
  }

  // Fetch image) from entity; returns { entityId: url|null }
  async function getImageBatch(entities) {
    entities.forEach(e => e.image = "https://commons.wikimedia.org/w/index.php?width=120&title=Special:Redirect/file/"+e.image);
    return entities;
  }

  // Fetch P18 (image) for a batch of entity IDs; returns { entityId: url|null }
  async function getP18ImageBatch(entityIds) {
    const result = Object.fromEntries(entityIds.map(id => [id, null]));
    try {
      const ids  = entityIds.join('|');
      const url  = `https://www.wikidata.org/w/api.php?action=wbgetentities`
                  + `&ids=${ids}&props=claims&format=json&origin=*`;
      const r    = await fetch(url);
      const data = await r.json();
      for (const entityId of entityIds) {
        const p18 = data.entities?.[entityId]?.claims?.P18 ?? [];
        const filename = p18[0]?.mainsnak?.datavalue?.value;
        if (!filename) continue;
        // Passe par notre cache local (cache/img/) au lieu de hotlinker Commons
        // directement, pour ne pas retélécharger la même image à chaque affichage.
        const params = new URLSearchParams({ qid: entityId, file: filename, width: '120' });
        result[entityId] = `image.php?${params.toString()}`;
      }
    } catch { /* silently ignore network errors */ }
    return result;
  }

  // ── Timeline ─────────────────────────────────────────────────────────────
  function renderTimeline() {
    const tl = document.getElementById('timeline');
    tl.style.display = 'block';
    tl.innerHTML = '';
    document.getElementById('results').innerHTML = '';

    const { allResults } = state;
    const totalPersons = allResults.reduce((s, r) => s + r.items.length, 0);
    const maxCount     = Math.max(...allResults.map(r => r.items.length), 1);

    const hdr = document.createElement('div');
    hdr.className = 'tl-header';
    hdr.innerHTML = `<span>${allResults.length} années · ${totalPersons} personnalités </span>`;
    tl.appendChild(hdr);

    for (const { year, items } of allResults) {
      const row = document.createElement('div');
      row.id        = `tl-${year}`;
      row.className = 'tl-row' + (items.length ? ' clickable' : '');
      const pct = items.length ? Math.max(1, Math.round(items.length / maxCount * 100)) : 0;
      row.innerHTML = `
        <span class="tl-year">${year}</span>
        <div class="tl-bar-wrap">
          ${items.length
            ? `<div class="tl-bar" style="width:${pct}%"><span class="tl-count">${items.length}</span></div>`
            : `<span class="tl-empty">aucun résultat</span>`}
        </div>`;
      if (items.length) row.onclick = () => showYearFromTimeline(year);
      tl.appendChild(row);
    }
  }

  function updateTimelineRow(year) {
    const row = document.getElementById(`tl-${year}`);
    if (!row) return;
    const entry = state.allResults.find(r => r.year === year);
    if (!entry) return;
    const maxCount = Math.max(...state.allResults.map(r => r.items.length), 1);
    const pct      = Math.max(1, Math.round(entry.items.length / maxCount * 100));
    row.className  = 'tl-row clickable';
    row.innerHTML  = `
      <span class="tl-year">${year}</span>
      <div class="tl-bar-wrap">
        <div class="tl-bar" style="width:${pct}%"><span class="tl-count">${entry.items.length}</span></div>
        <span class="tl-rendered">✓ affiché</span>
      </div>`;
    row.onclick = () => showYearFromTimeline(year);
  }

  function showYearFromTimeline(year) {
    // Revenir à la vue par année si on est en vue par catégorie
    if (state.viewMode === 'category') {
      state.viewMode = 'year';
      document.getElementById('groupToggleBtn').classList.remove('active');
      renderYearViewFromState();
    }

    // Retirer le focus des autres lignes
    document.querySelectorAll('.tl-row.tl-active').forEach(r => r.classList.remove('tl-active'));
    const row = document.getElementById(`tl-${year}`);
    if (row) row.classList.add('tl-active');

    // Si la section est déjà rendue, juste scroller
    const existing = document.getElementById(`year-${year}`);
    if (existing) {
      existing.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }

    // Rendre la section
    const entry = state.allResults.find(r => r.year === year);
    if (!entry) return;
    if (entry.items.length) {
      appendYearSection(year, state.day, state.month, entry.items);
    } else {
      const container = document.getElementById('results');
      const section = document.createElement('div');
      section.className = 'year-section';
      section.id = `year-${year}`;
      section.innerHTML = `
        <div class="year-heading">${year} <span class="year-count">aucun résultat</span></div>
        <p style="color:#475569;font-size:0.85rem;font-style:italic">Pas de personne née à cette date.</p>`;
      container.appendChild(section);
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Marquer comme affiché dans la timeline
    if (row) {
      const rendered = document.createElement('span');
      rendered.className = 'tl-rendered';
      rendered.textContent = '✓ affiché';
      row.querySelector('.tl-bar-wrap')?.appendChild(rendered);
    }
  }

  function finishSearch() {
    state.running = false;
    document.getElementById('searchBtn').disabled = false;
    document.getElementById('stop-bar').style.display = 'none';
    clearStatus();

    // Bornes du slider d'années
    const allYears = state.allResults.map(r => r.year).filter(Boolean);
    if (allYears.length) setYearSliderBounds(Math.min(...allYears), Math.max(...allYears));

    state.mapFilterIds = null;

    // Collecte les points géo pour la carte Leaflet
    state.mapPoints = [];
    for (const { year, items } of state.allResults) {
      for (const r of items) {
        const lat = parseFloat(r.lat);
        const lng = parseFloat(r.lng);
        if (!isNaN(lat) && !isNaN(lng))
          state.mapPoints.push({ id: r.id, label: r.label, lieu: r.lieu, year, lat, lng });
      }
    }
    updateLeafletMarkers();

    renderCalHeatmap();
    renderStats();
  }

  function renderStats() {
    const { allResults, day, month, startYear, endYear } = state;
    const el = document.getElementById('stats');
    if (!allResults.length) { el.classList.add('hidden'); return; }

    const total      = allResults.reduce((s, r) => s + r.items.length, 0);
    const yearsWithResults = allResults.filter(r => r.items.length > 0);
    const yearsEmpty = allResults.length - yearsWithResults.length;
    const avg        = yearsWithResults.length ? (total / yearsWithResults.length).toFixed(1) : 0;
    const peak       = allResults.reduce((best, r) => r.items.length > best.items.length ? r : best, allResults[0]);
    const byDesc     = [...allResults].sort((a, b) => b.items.length - a.items.length).slice(0, 5);
    const dateLabel  = `${String(day).padStart(2,'0')}/${String(month).padStart(2,'0')}`;

    el.innerHTML = `
      <div class="stats-title">📊 Statistiques — ${dateLabel} · ${startYear}→${endYear}</div>
      <div class="stats-grid">
        <div class="stats-card">
          <div class="stats-value">${total}</div>
          <div class="stats-label">personnalités au total</div>
        </div>
        <div class="stats-card">
          <div class="stats-value">${allResults.length}</div>
          <div class="stats-label">années analysées</div>
        </div>
        <div class="stats-card">
          <div class="stats-value">${avg}</div>
          <div class="stats-label">personnalités / an (moyenne)</div>
        </div>
        <div class="stats-card">
          <div class="stats-value">${yearsEmpty}</div>
          <div class="stats-label">années sans résultat</div>
        </div>
      </div>
      <div class="stats-peak">
        🏆 Année la plus riche : <strong>${peak.year}</strong> avec <strong>${peak.items.length}</strong> personnalité${peak.items.length > 1 ? 's' : ''}
      </div>
      <div class="stats-top">
        <div class="stats-top-title">Top 5 années</div>
        ${byDesc.map(r => `
          <div class="stats-top-row">
            <span class="stats-top-year">${r.year}</span>
            <div class="stats-top-bar-wrap">
              <div class="stats-top-bar" style="width:${Math.round(r.items.length / peak.items.length * 100)}%"></div>
            </div>
            <span class="stats-top-count">${r.items.length}</span>
          </div>`).join('')}
      </div>
`;
    el.classList.remove('hidden');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Panneau filtres + carte Leaflet ─────────────────────────────────────
  let leafletMap = null;
  let leafletLayer = null;
  let _leafletInitZoom = 2;

  function toggleFiltersPanel() {
    const panel = document.getElementById('filters-panel');
    const btn   = document.getElementById('filters-toggle-btn');
    const isOpen = !panel.classList.contains('hidden');
    panel.classList.toggle('hidden', isOpen);
    btn.classList.toggle('active', !isOpen);
    btn.textContent = isOpen ? '🔍 Filtres ▾' : '🔍 Filtres ▲';
    if (!isOpen) {
      if (!leafletMap) initLeafletMap();
      else setTimeout(() => leafletMap.invalidateSize(), 50);
    }
  }

  function initLeafletMap() {
    leafletMap = L.map('filter-map', { zoomControl: true }).setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 18,
    }).addTo(leafletMap);
    leafletMap.on('moveend zoomend', onLeafletMoveEnd);
    if (state.mapPoints.length) _populateLeafletMarkers();
  }

  function updateLeafletMarkers() {
    if (!leafletMap) return;
    _populateLeafletMarkers();
  }

  function _populateLeafletMarkers() {
    if (leafletLayer) { leafletLayer.clearLayers(); }
    else { leafletLayer = L.layerGroup().addTo(leafletMap); }

    for (const pt of state.mapPoints) {
      const m = L.circleMarker([pt.lat, pt.lng], {
        radius: 6,
        color: '#0ea5e9',
        fillColor: '#38bdf8',
        fillOpacity: 0.8,
        weight: 1.5,
      })
        .bindTooltip(`<strong>${pt.label}</strong><br>${pt.lieu || ''} · ${pt.year}`, { sticky: true })
        .on('click', () => showYearFromTimeline(pt.year));
      m._qid = pt.id;
      m.addTo(leafletLayer);
    }

    if (state.mapPoints.length) {
      const bounds = L.latLngBounds(state.mapPoints.map(p => [p.lat, p.lng]));
      leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 5 });
      _leafletInitZoom = leafletMap.getZoom();
    }
    // Réinitialise le filtre carte après un nouveau chargement
    state.mapFilterIds = null;
    document.getElementById('map-filter-badge').classList.add('hidden');
  }

  function onLeafletMoveEnd() {
    const zoom = leafletMap.getZoom();
    const badge = document.getElementById('map-filter-badge');
    if (zoom <= _leafletInitZoom) {
      state.mapFilterIds = null;
      badge.classList.add('hidden');
    } else {
      const bounds = leafletMap.getBounds();
      const visibleIds = new Set();
      for (const pt of state.mapPoints) {
        if (bounds.contains([pt.lat, pt.lng])) visibleIds.add(pt.id);
      }
      state.mapFilterIds = visibleIds;
      badge.classList.remove('hidden');
    }
    applyFilters();
  }

      el.innerHTML = `<div class="error">${msg}</div>`;
    }
  }

  }

  async function confirmSaveSelection() {
    const title    = document.getElementById('sel-title').value.trim()  || 'Sans titre';
    const author   = document.getElementById('sel-author').value.trim() || '';
    document.getElementById('save-selection-modal').classList.add('hidden');

    const meta     = { ...selectionMeta(), titre: title, auteur: author };
    const filename = selectionFilename('json');
    const payload  = { recherche: meta, items: selection.items };
    const json     = JSON.stringify(payload, null, 2);

    try {
      await fetch(`selections.php?action=save&file=${encodeURIComponent(filename)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

  function exportSelectionCsv() {
    const meta = selectionMeta();
    const header = `# Sélection — ${meta.date} — ${meta.periodeDebut}–${meta.periodeFin} — exporté le ${meta.exportedAt}`;
    const rows = [['Nom', 'Description', 'Année', 'Wikipedia', 'Wikidata']];
    for (const it of selection.items) {
      rows.push([
        `"${(it.name || '').replace(/"/g, '""')}"`,
        `"${(it.desc || '').replace(/"/g, '""')}"`,
        it.year || '',
        it.wpUrl || '',
        it.wikidataUrl || '',
      ]);
    }
    const csv = header + '\n' + rows.map(r => r.join(',')).join('\n');
    downloadBlob(csv, selectionFilename('csv'), 'text/csv;charset=utf-8');
  }

  function exportSelectionQmd() {
    const meta = selectionMeta();
    let qmd = `---\ntitle: "Sélection — ${meta.date}"\ndate: "${meta.exportedAt}"\n`;
    qmd += `params:\n  date: "${meta.date}"\n  debut: ${meta.periodeDebut}\n  fin: ${meta.periodeFin}\n`;
    qmd += `format:\n  html:\n    toc: true\n---\n\n`;
    qmd += `*Date : **${meta.date}** · Période : **${meta.periodeDebut}–${meta.periodeFin}** · `;
    qmd += `${meta.total} personnalité${meta.total > 1 ? 's' : ''} sélectionnée${meta.total > 1 ? 's' : ''}*\n\n`;
    qmd += `| Nom | Description | Année | Wikipedia | Wikidata |\n`;
    qmd += `|-----|-------------|-------|-----------|----------|\n`;
    for (const it of selection.items) {
      const name = (it.name || '').replace(/\|/g, '\\|');
      const desc = (it.desc || '').replace(/\|/g, '\\|');
      const wp   = it.wpUrl       ? `[Wikipedia](${it.wpUrl})`     : '';
      const wd   = it.wikidataUrl ? `[Wikidata](${it.wikidataUrl})` : '';
      qmd += `| **${name}** | ${desc} | ${it.year || ''} | ${wp} | ${wd} |\n`;
    }
    downloadBlob(qmd, selectionFilename('qmd'), 'text/plain;charset=utf-8');
  }

  function loadSelectionFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        document.getElementById('selections-panel').classList.add('hidden');
        document.getElementById('sel-file-input').value = '';

        const meta  = data.recherche || {};
        const items = data.items     || [];

        document.getElementById('selection-view-title').textContent =
          meta.titre || `Sélection du ${meta.date || ''}`;
        document.getElementById('selection-view-meta').textContent = [
          meta.auteur     ? `par ${meta.auteur}` : '',
          meta.date       ? `📅 ${meta.date}` : '',
          (meta.periodeDebut && meta.periodeFin) ? `${meta.periodeDebut}–${meta.periodeFin}` : '',
          `${items.length} personnalité${items.length > 1 ? 's' : ''}`,
          meta.exportedAt ? `enregistré le ${meta.exportedAt}` : '',
        ].filter(Boolean).join(' · ');

        const grid = document.getElementById('selection-view-grid');
        grid.innerHTML = '';
        for (const it of items) {
          const wp = it.wpUrl       ? `<a class="card-link" href="${escapeHtml(it.wpUrl)}" target="_blank" rel="noopener">Wikipedia →</a>` : '';
          const wd = it.wikidataUrl ? `<a class="card-link" href="${escapeHtml(it.wikidataUrl)}" target="_blank" rel="noopener">Wikidata →</a>` : '';
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-name">${escapeHtml(it.name || '')}</div>
            ${it.desc ? `<div class="card-desc">${escapeHtml(it.desc)}</div>` : ''}
            ${it.year ? `<div class="card-date"><span>${it.year}</span></div>` : ''}
            <img id="${it.qid}-img" />
            <div style="margin-top:auto;display:flex;gap:0.6rem;flex-wrap:wrap">${wp}${wd}</div>`;
          grid.appendChild(card);
          if (it.qid) imageRateLimiter.enqueue({ id: it.qid, image: null }, document.getElementById(it.qid + '-img'));
        }
        document.getElementById('results').classList.add('hidden');
        document.getElementById('selection-view').classList.remove('hidden');
        document.getElementById('selection-view').scrollIntoView({ behavior: 'smooth', block: 'start' });
        showToast(`✅ ${file.name} chargé (${items.length} entrée${items.length > 1 ? 's' : ''})`);
      } catch (err) {
        showToast(`❌ Fichier invalide : ${err.message}`);
      }
    };
    reader.readAsText(file);
  }

  async function loadSelectionsList() {
    const ul = document.getElementById('selections-list');
    ul.innerHTML = '<li style="color:#475569;padding:0.5rem 0.8rem;font-size:0.85rem">Chargement…</li>';
    try {
      const res  = await fetch('selections.php?action=list');

        ul.innerHTML = '<li style="color:#475569;padding:0.5rem 0.8rem;font-size:0.85rem">Aucune sélection enregistrée.</li>';

      ul.innerHTML = '';
      for (const s of list) {

        li.className = 'archive-item';
        li.innerHTML = `
          <div class="archive-item-title">📅 ${escapeHtml(s.date)} — ${s.debut}→${s.fin}</div>
          <div class="archive-item-meta">${s.total} personnalité${s.total > 1 ? 's' : ''} · enregistré le ${escapeHtml(s.saved)}</div>

  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

    document.body.appendChild(t);
    setTimeout(() => t.remove(), 5000);
  }

  // ── Paramètres URL ───────────────────────────────────────────────────────
  (function initFromUrl() {
    const params  = new URLSearchParams(location.search);
    const today = new Date();
    const pDay   = params.get('day')   ?? String(today.getDate());
    const pMonth = params.get('month') ?? String(today.getMonth() + 1);
    const pStart = params.get('startYear');
    const pEnd   = params.get('endYear');

    if (pDay)   { document.getElementById('day').value       = pDay;   }
    if (pMonth) { document.getElementById('month').value     = pMonth; }
    if (pStart) { document.getElementById('startYear').value = pStart; }
    if (pEnd)   { document.getElementById('endYear').value   = pEnd;   }

    if ((pDay || pMonth || pStart || pEnd) & params.size > 0) search();
  })();


  function setLegend(data, cont, color){

    const width = 900;
    const height = 100;
    const marginTop = 20;
    const marginRight = 20;
    const marginBottom = 30;
    const marginLeft = 40;
    // Declare the x (horizontal position) scale.
    const extentX = d3.extent(data, (d) => d[0]);
    const extentY = d3.extent(data, (d) => d[1].length);

    const x = d3.scaleLinear()
        .domain(extentX)
        .range([marginLeft, width - marginRight]);

    // Declare the y (vertical position) scale.
    const y = d3.scaleSymlog()
        .domain(extentY)
        .range([height - marginBottom, marginTop]);

    // Create the SVG container.
    const svg = cont.append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height])
        .attr("style", "max-width: 100%; height: auto;");

    // Add a rect for each bin.
    svg.append("g")
      .selectAll()
      .data(data)
      .join("rect")
        .attr("x", (d) => {
          return x(d[0]);
        })
        .attr("width", (d) => width/extentX[1])
        .attr("y", (d) => {
          return y(d[1].length);
        })
        .attr("height", (d) => {
          return y(extentY[0]) - y(d[1].length);
        })
        .attr("fill", d=>color(d[0]))
        .on("click",(e,d)=>{
          console.log(d);
        });


    // Add the x-axis and label.
    svg.append("g")
        .attr("transform", `translate(0,${height - marginBottom})`)
        .call(d3.axisBottom(x).ticks(width / 80).tickSizeOuter(0))
        .call((g) => g.append("text")
            .attr("x", width)
            .attr("y", marginBottom)
            .attr("fill", "currentColor")
            .attr("text-anchor", "end")
            .text("Nb de personne dans l'année"));

    // Add the y-axis and label, and remove the domain line.
    svg.append("g")
        .attr("transform", `translate(${marginLeft},0)`)
        .call(d3.axisLeft(y).ticks(height / 40))
        //.call((g) => g.select(".domain").remove())
        .call((g) => g.append("text")
            .attr("x", -marginLeft)
            .attr("y", 10)
            .attr("fill", "currentColor")
            .attr("text-anchor", "start")
            .text("Nombre d'année"));   
  }

  let mobileHeaderVisible = true;

  function isPortraitPhone() {
    return window.matchMedia('(max-width: 768px) and (orientation: portrait)').matches;
  }

  function syncMobileHeader() {
    const btn = document.getElementById('header-toggle-btn');
    if (!btn) return;

    if (isPortraitPhone()) {
      document.body.classList.toggle('mobile-header-collapsed', !mobileHeaderVisible);
      btn.textContent = mobileHeaderVisible ? 'Fermer' : 'Menu';
      btn.setAttribute('aria-expanded', mobileHeaderVisible ? 'true' : 'false');
    } else {
      document.body.classList.remove('mobile-header-collapsed');
      mobileHeaderVisible = true;
      btn.setAttribute('aria-expanded', 'true');
    }
  }

  function toggleMobileHeader() {
    if (!isPortraitPhone()) return;
    mobileHeaderVisible = !mobileHeaderVisible;
    syncMobileHeader();
  }

  window.addEventListener('resize', syncMobileHeader);
  window.addEventListener('orientationchange', syncMobileHeader);
  syncMobileHeader();

</script>
